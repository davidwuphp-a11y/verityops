name: Publish VerityOps website
on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
      - LICENSE
  workflow_dispatch:

permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Test and build the allowlisted static site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 -B website/qa/test_site.py
          python3 -B website/build.py --base-url "$SITE_BASE" --output _site
          cp LICENSE _site/LICENSE.txt
          python3 -B website/check_export.py _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
